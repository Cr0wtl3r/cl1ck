<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cl1ck PoC - {{.Domain}}</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        background-color: #121212;
        color: #e5e7eb;
        font-family: "JetBrains Mono", "Courier New", Courier, monospace;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
      }
      .wrap {
        width: min(1800px, 96vw);
        height: 96vh;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      h1 {
        color: #ef4444;
        font-size: 2em;
        letter-spacing: 2px;
        text-shadow: 0 0 10px #ef4444;
      }
      .sub {
        color: #b91c1c;
        font-size: 0.95em;
        letter-spacing: 1px;
      }
      .target {
        font-size: 0.85em;
        word-break: break-all;
      }
      .target code {
        background: #450a0a;
        border: 1px solid #b91c1c;
        border-radius: 4px;
        padding: 2px 8px;
      }
      .status {
        padding: 8px;
        border-radius: 8px;
        border: 1px solid;
        font-weight: bold;
        font-size: 0.9em;
        letter-spacing: 1px;
      }
      .status.potential {
        color: #ef4444;
        border-color: #b91c1c;
        background: rgba(69, 10, 10, 0.35);
      }
      .status.confirmed {
        color: #ff6b6b;
        border-color: #ef4444;
        background: rgba(185, 28, 28, 0.35);
      }
      .status.protected {
        color: #4ade80;
        border-color: #166534;
        background: rgba(22, 101, 52, 0.25);
      }
      .status.inconclusive {
        color: #a7b3c7;
        border-color: #450a0a;
        background: rgba(69, 10, 10, 0.2);
      }
      .frame-area {
        flex: 1;
        min-height: 0;
        border: 2px solid #b91c1c;
        border-radius: 10px;
        box-shadow: 0 0 15px rgba(185, 28, 28, 0.35);
        overflow: hidden;
        background: #0a0a0a;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        background: #ffffff;
      }
    </style>
  </head>

  <body>
    <div class="wrap">
      <h1>cl1ck</h1>
      <div class="sub">{{.Description}} &mdash; By: {{.Author}}</div>
      <div class="target">Target: <code>{{.TargetURL}}</code></div>
      <div class="status {{.StatusClass}}">{{.Status}}</div>
      <div class="frame-area">
        <iframe
          id="target-iframe"
          src="{{.TargetURL}}"
          title="Clickjacking PoC frame"
        ></iframe>
      </div>
    </div>
  </body>
</html>
